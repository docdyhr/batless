name: Publish to Crates.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v0.5.0)"
        required: true

permissions: read-all

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable

      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          if cargo search batless --limit 1 | grep -q "\"$VERSION\""; then
            echo "Version $VERSION already published on crates.io, skipping"
          else
            cargo publish
          fi
