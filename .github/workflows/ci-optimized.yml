name: CI/CD Optimized

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual CI trigger"
        required: false
        default: "Manual CI execution"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    uses: docdyhr/.github/.github/workflows/rust-ci.yml@b76712b10f46a2e8a54efd897218271ee8ffdc6f # v1
    with:
      binary-name: batless
      msrv: "1.88.0" # keep in sync with Cargo.toml rust-version
    secrets: inherit # pragma: allowlist secret

  # Extended integration smoke tests (batless-specific)
  integration-smoke:
    name: Integration Smoke
    needs: ci
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build and smoke test
        run: |
          cargo build --release
          ./target/release/batless --version
          ./target/release/batless README.md --mode=plain --max-lines=5
          ./target/release/batless Cargo.toml --mode=json --max-lines=3

  # Benchmark gate — main only
  benchmark:
    name: Performance Benchmark
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run benchmarks
        run: |
          cargo build --release
          echo "Benchmarks would run here"
