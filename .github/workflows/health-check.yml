name: Repository Health Check

on:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    uses: docdyhr/.github/.github/workflows/rust-health-check.yml@98e09a1614eaa2d49ccf27dcd905d88d633c1638 # v1
    secrets: inherit # pragma: allowlist secret
