name: Repository Health Check

on:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    uses: docdyhr/.github/.github/workflows/rust-health-check.yml@2eea0207aab917043bfc06928dbe6ecdf75b98a1 # v1
    secrets: inherit # pragma: allowlist secret
