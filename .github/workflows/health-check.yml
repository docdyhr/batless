name: Repository Health Check

on:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    uses: docdyhr/.github/.github/workflows/rust-health-check.yml@364c7e1b7a342f547a7fa7a28e774291662fdf3d # v1
    secrets: inherit # pragma: allowlist secret
