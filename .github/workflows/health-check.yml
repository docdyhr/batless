name: Repository Health Check

on:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    uses: docdyhr/.github/.github/workflows/rust-health-check.yml@b76712b10f46a2e8a54efd897218271ee8ffdc6f # v1
    secrets: inherit # pragma: allowlist secret
