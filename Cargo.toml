[package]
name = "batless"
version = "0.7.2"
edition = "2021"
rust-version = "1.88.0"
authors = ["Thomas <thomas@docdyhr.com>"]
description = "A fast, non-blocking code and text viewer inspired by bat"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/docdyhr/batless"
repository = "https://github.com/docdyhr/batless"
documentation = "https://docs.rs/batless"
keywords = ["cli", "code-viewer", "cat", "pager", "viewer"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
# Allowlist: only what's needed to build, test, and document the crate.
# Cargo.toml and Cargo.lock are always included.
include = [
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "build.rs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]
build = "build.rs"

[lib]
name = "batless"
path = "src/lib.rs"

[[bin]]
name = "batless"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"
is-terminal = "0.4"
termcolor = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
toml = "1.1"
dirs = "7"

[dev-dependencies]
tempfile = "3.27"
serde_json = "1.0"

# Enhanced testing dependencies
proptest = { version = "1.11", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false, features = ["rayon", "cargo_bench_support"] }

[[bench]]
name = "performance"
harness = false

# Cargo's default release profile only strips debuginfo, leaving the symbol
# table in release artifacts (~370KB on macOS arm64). For profiling, override
# with CARGO_PROFILE_RELEASE_STRIP=false CARGO_PROFILE_RELEASE_DEBUG=true.
[profile.release]
strip = true

# Resolve duplicate dependencies by forcing newer compatible versions
[workspace]
resolver = "2"
